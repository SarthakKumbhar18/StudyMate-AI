<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delete Question - StudyMate AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  (function () {
    var saved = localStorage.getItem('studymate-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<style>
  :root {
    --bg-color: #F8FAFC; --card-color: #FFFFFF; --text-color: #0F172A; --secondary-text: #64748B;
    --border-color: #E2E8F0; --primary-color: #4F46E5; --secondary-color: #6366F1;
    --success-color: #16A34A; --warning-color: #F59E0B; --danger-color: #DC2626;
    --shadow-soft: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
    --nav-height: 72px;
  }
  [data-theme="dark"] {
    --bg-color: #0F172A; --card-color: #1E293B; --text-color: #F8FAFC; --secondary-text: #94A3B8;
    --border-color: #334155; --primary-color: #6366F1; --secondary-color: #818CF8;
    --success-color: #22C55E; --warning-color: #F59E0B; --danger-color: #EF4444;
    --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 28px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background-color: var(--bg-color); color: var(--text-color);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased;
    padding-top: var(--nav-height);
  }
  a { text-decoration: none; }
  h1, h2, h3, h4, h5, .brand-word { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.02em; }

  .app-header {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height); display: flex; align-items: center;
    background-color: color-mix(in srgb, var(--bg-color) 90%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-color); z-index: 1000;
  }
  .nav-inner { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text-color); flex-shrink: 0; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; flex-shrink: 0; }
  .brand-word { font-weight: 700; font-size: 18px; }
  .app-nav-links { display: flex; align-items: center; gap: 2px; overflow-x: auto; }
  .app-nav-links a { font-size: 14px; font-weight: 500; color: var(--secondary-text); padding: 8px 13px; border-radius: 8px; white-space: nowrap; }
  .app-nav-links a:hover { background-color: color-mix(in srgb, var(--primary-color) 8%, transparent); color: var(--text-color); }
  .app-nav-links a.active { color: var(--primary-color); background-color: color-mix(in srgb, var(--primary-color) 10%, transparent); }
  .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .theme-toggle { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border-color); background: var(--card-color); color: var(--text-color); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
  .btn-logout { display: flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--danger-color) 35%, transparent); background: color-mix(in srgb, var(--danger-color) 10%, transparent); color: var(--danger-color); font-size: 13.5px; font-weight: 600; }
  .btn-logout:hover { background: color-mix(in srgb, var(--danger-color) 18%, transparent); color: var(--danger-color); }
  @media (max-width: 1050px) { .app-nav-links { display: none; } }

  .page-wrap { max-width: 1240px; margin: 0 auto; padding: 36px 24px 80px; }
  .page-wrap.narrow { max-width: 780px; }
  .page-wrap.medium { max-width: 960px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  .page-head h1, .page-head h2 { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
  .page-head p { font-size: 14.5px; color: var(--secondary-text); margin: 0; }
  .page-head p strong { color: var(--text-color); }

  .surface-card { background: var(--card-color); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-soft); }
  .card-pad { padding: 26px; }
  .section-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--secondary-text); margin: 0 0 14px; display: flex; align-items: center; gap: 7px; }

  .btn-main, .btn-ghost, .btn-success-solid, .btn-danger-solid { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 9px; font-size: 14.5px; font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: transform 0.15s ease; }
  .btn-main { color: #fff; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); box-shadow: 0 8px 18px color-mix(in srgb, var(--primary-color) 30%, transparent); }
  .btn-success-solid { color: #fff; background: linear-gradient(135deg, var(--success-color), #22C55E); box-shadow: 0 8px 18px color-mix(in srgb, var(--success-color) 28%, transparent); }
  .btn-danger-solid { color: #fff; background: linear-gradient(135deg, var(--danger-color), #EF4444); box-shadow: 0 8px 18px color-mix(in srgb, var(--danger-color) 28%, transparent); }
  .btn-main:hover, .btn-success-solid:hover, .btn-danger-solid:hover { transform: translateY(-1px); color: #fff; }
  .btn-ghost { background: var(--card-color); color: var(--text-color); border: 1px solid var(--border-color); }
  .btn-ghost:hover { border-color: var(--primary-color); color: var(--primary-color); }
  .btn-sm { padding: 7px 13px; font-size: 12.5px; border-radius: 8px; border: 1.5px solid; background: transparent; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .btn-sm.primary { color: var(--primary-color); border-color: var(--primary-color); }
  .btn-sm.primary:hover { background: color-mix(in srgb, var(--primary-color) 8%, transparent); color: var(--primary-color); }
  .btn-sm.danger { color: var(--danger-color); border-color: var(--danger-color); }
  .btn-sm.danger:hover { background: color-mix(in srgb, var(--danger-color) 8%, transparent); color: var(--danger-color); }
  .btn-sm.success { color: var(--success-color); border-color: var(--success-color); }
  .btn-sm.success:hover { background: color-mix(in srgb, var(--success-color) 8%, transparent); color: var(--success-color); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 4px 11px; border-radius: 999px; background: var(--bg-color); color: var(--secondary-text); border: 1px solid var(--border-color); }
  .pill.success { background: color-mix(in srgb, var(--success-color) 14%, transparent); color: var(--success-color); border-color: transparent; }
  .pill.warning { background: color-mix(in srgb, var(--warning-color) 16%, transparent); color: var(--warning-color); border-color: transparent; }
  .pill.primary { background: color-mix(in srgb, var(--primary-color) 12%, transparent); color: var(--primary-color); border-color: transparent; }
  .pill.danger { background: color-mix(in srgb, var(--danger-color) 14%, transparent); color: var(--danger-color); border-color: transparent; }

  .note { display: flex; align-items: flex-start; gap: 10px; padding: 13px 16px; border-radius: 10px; font-size: 13.5px; border: 1px solid; margin-bottom: 16px; line-height: 1.5; }
  .note i { margin-top: 2px; }
  .note.success { background: color-mix(in srgb, var(--success-color) 12%, transparent); color: var(--success-color); border-color: color-mix(in srgb, var(--success-color) 30%, transparent); }
  .note.warning { background: color-mix(in srgb, var(--warning-color) 14%, transparent); color: var(--warning-color); border-color: color-mix(in srgb, var(--warning-color) 34%, transparent); }
  .note.neutral { background: var(--bg-color); color: var(--secondary-text); border-color: var(--border-color); }

  .empty-state { background: var(--card-color); border: 1px dashed var(--border-color); border-radius: 16px; padding: 56px 24px; text-align: center; }
  .empty-state i { font-size: 38px; color: var(--primary-color); opacity: 0.5; margin-bottom: 14px; display: block; }
  .empty-state h4 { font-size: 17px; margin: 0 0 8px; }
  .empty-state p { font-size: 14px; color: var(--secondary-text); margin: 0 0 20px; }
  .empty-state.compact { padding: 36px 20px; }
  .empty-state.compact p { margin: 0; }

  .confirm-wrap { max-width: 520px; margin: 40px auto 0; }
  .confirm-card { padding: 36px 32px; text-align: center; }
  .confirm-icon { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; background: color-mix(in srgb, var(--danger-color) 12%, transparent); color: var(--danger-color); }
  .confirm-card h3 { font-size: 22px; font-weight: 700; margin: 0 0 10px; }
  .confirm-card p { font-size: 14.5px; color: var(--secondary-text); margin: 0 0 18px; line-height: 1.6; }
  .confirm-card p strong { color: var(--text-color); }
  .quote-box { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; font-size: 14px; text-align: left; margin-bottom: 18px; line-height: 1.6; }
  .warn-line { display: inline-flex; align-items: center; gap: 6px; color: var(--danger-color) !important; font-weight: 600; font-size: 13.5px !important; }
  .confirm-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>

<body>

<header class="app-header">
  <div class="nav-inner">
    <a href="/" class="brand">
      <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
      <span class="brand-word">StudyMate <span style="color: var(--primary-color);">AI</span></span>
    </a>

    <nav class="app-nav-links">
      <a href="{% url 'tutor_dashboard' %}"><i class="bi bi-grid-1x2 me-1"></i> Dashboard</a>
      <a href="{% url 'my_courses' %}" class="active">My Courses</a>
      <a href="{% url 'create_course' %}">Create Course</a>
    </nav>

    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <i class="bi bi-moon-stars" id="themeIcon"></i>
      </button>
      <a href="{% url 'logout' %}" class="btn-logout">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </div>
  </div>
</header>


<div class="page-wrap">
  <div class="confirm-wrap">
    <div class="surface-card confirm-card">
      <div class="confirm-icon"><i class="bi bi-trash3"></i></div>

      <h3>Delete Question?</h3>

      <p>Are you sure you want to delete this question?</p>

      <div class="quote-box">{{ question.question }}</div>

      <p class="warn-line"><i class="bi bi-exclamation-triangle-fill"></i> This action cannot be undone.</p>

      <form method="POST">
        {% csrf_token %}

        <div class="confirm-actions">
          <button type="submit" class="btn-danger-solid"><i class="bi bi-trash3"></i> Yes, Delete Question</button>
          <a href="{% url 'manage_quiz' question.quiz.section.id %}" class="btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>


<script>
  var root = document.documentElement;
  var themeToggle = document.getElementById('themeToggle');
  var themeIcon = document.getElementById('themeIcon');
  function syncThemeIcon() {
    var isDark = root.getAttribute('data-theme') === 'dark';
    themeIcon.className = isDark ? 'bi bi-sun' : 'bi bi-moon-stars';
  }
  syncThemeIcon();
  themeToggle.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('studymate-theme', next);
    syncThemeIcon();
  });
</script>

</body>
</html>
